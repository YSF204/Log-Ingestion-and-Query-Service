name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logs_user
          POSTGRES_PASSWORD: logs_password
          POSTGRES_DB: logs_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U logs_user -d logs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://logs_user:logs_password@127.0.0.1:5433/logs_db
      RETENTION_DAYS: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run automated tests
        run: npm test

  contract-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the zero-configuration stack
        run: docker compose up --detach --build db app

      - name: Run required-contract smoke test
        run: npm run test:smoke

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color app db

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
