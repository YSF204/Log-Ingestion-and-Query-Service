services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: logs_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logs_user -d logs_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
