services:
  db:
    image: postgres:16-alpine
    cpus: 1.0
    mem_limit: 1g
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - wal_buffers=64MB
      - -c
      - shared_buffers=256MB
      - -c
      - bgwriter_lru_maxpages=1000
      - -c
      - bgwriter_lru_multiplier=4.0
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: logs_db
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logs_user -d logs_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://logs_user:logs_password@db:5432/logs_db
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      DB_READ_POOL_MAX: 4
      INGEST_COALESCE_MS: 50
      INGEST_MAX_COALESCED_LOGS: 10000
      GIN_CLEANUP_IDLE_MS: 2000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 1s
      timeout: 2s
      retries: 30

  k6:
    image: grafana/k6:latest
    profiles:
      - load-test
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://app:8080
      BATCH_SIZE: ${LOAD_BATCH_SIZE:-500}
      LOGS_PER_SECOND: ${LOAD_LOGS_PER_SECOND:-22500}
      DURATION: ${LOAD_DURATION:-60s}
      LOAD_RATE_STAGES: ${LOAD_RATE_STAGES:-}
      LOAD_MODE: ${LOAD_MODE:-both}
      LOAD_AGGREGATION_RATE: ${LOAD_AGGREGATION_RATE:-1}
      PRE_ALLOCATED_VUS: ${LOAD_PRE_ALLOCATED_VUS:-100}
      MAX_VUS: ${LOAD_MAX_VUS:-500}
      AGGREGATION_WINDOW_MINUTES: ${LOAD_AGGREGATION_WINDOW_MINUTES:-60}
    command:
      - run
      - /scripts/k6.js
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
